[workspace]
resolver = "3"
members = [
  "crates/crypto",
  "crates/format",
  "crates/provider-local",
  "crates/vault",
  "crates/test-vectors",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/akiralazycat/eidoron"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Exact RustCrypto releases that build on the pinned Rust 1.99.1.
# UniFFI and secrecy are intentionally absent.
[workspace.dependencies]
argon2 = "=0.6.0"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
chacha20poly1305 = "=0.11.0"
zeroize = "=1.9.1"
